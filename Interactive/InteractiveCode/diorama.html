<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>2024-2025 F2XGA: Example Lab</title>
</head>

<body>
    <canvas
        style="width:calc(100vw - 40px);height:calc(100vh - 40px);display:block;margin:20px auto;box-shadow:0 0 12px rgba(0,0,0,0.35);"></canvas>
    <script type="module">
        // Minimal OBJ parser with vt/vn support, builds interleaved buffer (pos,uv,normal)
        function parseOBJWithUVs(text) {
            const positions = [], uvs = [], normals = [];
            const vertexMap = new Map();
            const vertexData = [];
            const indices = [];
            let nextIndex = 0;
            for (const line of text.split('\n')) {
                const parts = line.trim().split(/\s+/);
                if (!parts[0]) continue;
                // Pushing positions, uvs, normals, and face into respective array
                if (parts[0] === 'v') positions.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
                else if (parts[0] === 'vt') uvs.push([parseFloat(parts[1]), 1.0 - parseFloat(parts[2])]);
                else if (parts[0] === 'vn') normals.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
                else if (parts[0] === 'f') {
                    const face = parts.slice(1);
                    const faceIdx = [];
                    for (const token of face) {
                        let vi = vertexMap.get(token);
                        if (vi === undefined) {
                            const [vStr, vtStr, vnStr] = token.split('/');
                            const vIdx = parseInt(vStr) - 1;
                            const vtIdx = vtStr ? parseInt(vtStr) - 1 : -1;
                            const vnIdx = vnStr ? parseInt(vnStr) - 1 : -1;
                            const p = positions[vIdx] || [0, 0, 0];
                            const uv = vtIdx >= 0 ? uvs[vtIdx] : [0.5, 0.5];
                            const n = vnIdx >= 0 ? normals[vnIdx] : [0, 1, 0];
                            vertexData.push(p[0], p[1], p[2], uv[0], uv[1], n[0], n[1], n[2]);
                            vi = nextIndex++;
                            vertexMap.set(token, vi);
                        }
                        faceIdx.push(vi);
                    }
                    for (let i = 1; i < faceIdx.length - 1; ++i) indices.push(faceIdx[0], faceIdx[i], faceIdx[i + 1]);
                }
            }
            return { vertexData: new Float32Array(vertexData), indices: new Uint32Array(indices) };
        }

        // Math helpers
        function computeBounds(positions) {
            const min = [Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY];
            const max = [Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY];
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i], y = positions[i + 1], z = positions[i + 2];
                if (x < min[0]) min[0] = x; if (y < min[1]) min[1] = y; if (z < min[2]) min[2] = z;
                if (x > max[0]) max[0] = x; if (y > max[1]) max[1] = y; if (z > max[2]) max[2] = z;
            }
            const center = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
            const dx = max[0] - min[0], dy = max[1] - min[1], dz = max[2] - min[2];
            const radius = Math.sqrt(dx * dx + dy * dy + dz * dz) / 2;
            return { min, max, center, radius };
        }

        function lookAt(eye, center, up) {
            const z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
            let zlen = Math.hypot(z0, z1, z2); if (zlen === 0) zlen = 1;
            const zx = z0 / zlen, zy = z1 / zlen, zz = z2 / zlen;
            const ux = up[0], uy = up[1], uz = up[2];
            let xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx;
            let xlen = Math.hypot(xx, xy, xz); if (xlen === 0) xlen = 1;
            xx /= xlen; xy /= xlen; xz /= xlen;
            const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
            const m = new Float32Array(16);
            m[0] = xx; m[1] = yx; m[2] = zx; m[3] = 0;
            m[4] = xy; m[5] = yy; m[6] = zy; m[7] = 0;
            m[8] = xz; m[9] = yz; m[10] = zz; m[11] = 0;
            m[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
            m[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
            m[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
            m[15] = 1;
            return m;
        }

        function perspective(fovYRadians, aspect, near, far) {
            const f = 1.0 / Math.tan(fovYRadians / 2);
            const m = new Float32Array(16);
            m[0] = f / aspect; m[1] = 0; m[2] = 0; m[3] = 0;
            m[4] = 0; m[5] = f; m[6] = 0; m[7] = 0;
            m[8] = 0; m[9] = 0; m[10] = (far + near) / (near - far); m[11] = -1;
            m[12] = 0; m[13] = 0; m[14] = (2 * far * near) / (near - far); m[15] = 0;
            return m;
        }

        // Multiply two 4x4 matrices
        function multiplyMat4(a, b) {
            const out = new Float32Array(16);
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    let s = 0;
                    for (let k = 0; k < 4; k++) s += a[r + k * 4] * b[k + c * 4];
                    out[r + c * 4] = s;
                }
            }
            return out;
        }

        // Compute per-vertex tangents for normal mapping
        function computeTangentsFromVertexData(vertexData, indices) {
            const vertCount = vertexData.length / 8;
            const tan1 = new Float32Array(vertCount * 3);
            const tan2 = new Float32Array(vertCount * 3);
            function addVec(dst, idx, x, y, z) { dst[idx * 3 + 0] += x; dst[idx * 3 + 1] += y; dst[idx * 3 + 2] += z; }

            for (let i = 0; i < indices.length; i += 3) {
                const i0 = indices[i], i1 = indices[i + 1], i2 = indices[i + 2];
                const p0x = vertexData[i0 * 8 + 0], p0y = vertexData[i0 * 8 + 1], p0z = vertexData[i0 * 8 + 2];
                const p1x = vertexData[i1 * 8 + 0], p1y = vertexData[i1 * 8 + 1], p1z = vertexData[i1 * 8 + 2];
                const p2x = vertexData[i2 * 8 + 0], p2y = vertexData[i2 * 8 + 1], p2z = vertexData[i2 * 8 + 2];

                const uv0x = vertexData[i0 * 8 + 3], uv0y = vertexData[i0 * 8 + 4];
                const uv1x = vertexData[i1 * 8 + 3], uv1y = vertexData[i1 * 8 + 4];
                const uv2x = vertexData[i2 * 8 + 3], uv2y = vertexData[i2 * 8 + 4];

                const x1 = p1x - p0x, y1 = p1y - p0y, z1 = p1z - p0z;
                const x2 = p2x - p0x, y2 = p2y - p0y, z2 = p2z - p0z;

                const s1 = uv1x - uv0x, t1 = uv1y - uv0y;
                const s2 = uv2x - uv0x, t2 = uv2y - uv0y;

                let r = (s1 * t2 - s2 * t1);
                if (r === 0) r = 1e-6;
                r = 1.0 / r;
                const sx = (t2 * x1 - t1 * x2) * r;
                const sy = (t2 * y1 - t1 * y2) * r;
                const sz = (t2 * z1 - t1 * z2) * r;
                const tx = (s1 * x2 - s2 * x1) * r;
                const ty = (s1 * y2 - s2 * y1) * r;
                const tz = (s1 * z2 - s2 * z1) * r;

                addVec(tan1, i0, sx, sy, sz);
                addVec(tan1, i1, sx, sy, sz);
                addVec(tan1, i2, sx, sy, sz);

                addVec(tan2, i0, tx, ty, tz);
                addVec(tan2, i1, tx, ty, tz);
                addVec(tan2, i2, tx, ty, tz);
            }

            const tangents = new Float32Array(vertCount * 3);
            for (let i = 0; i < vertCount; ++i) {
                const nx = vertexData[i * 8 + 5], ny = vertexData[i * 8 + 6], nz = vertexData[i * 8 + 7];
                let tx = tan1[i * 3 + 0], ty = tan1[i * 3 + 1], tz = tan1[i * 3 + 2];
                const dotNT = nx * tx + ny * ty + nz * tz;
                tx = tx - nx * dotNT; ty = ty - ny * dotNT; tz = tz - nz * dotNT;
                let len = Math.hypot(tx, ty, tz);
                if (len === 0) { tx = 1; ty = 0; tz = 0; len = 1; }
                tx /= len; ty /= len; tz /= len;
                tangents[i * 3 + 0] = tx; tangents[i * 3 + 1] = ty; tangents[i * 3 + 2] = tz;
            }
            return tangents;
        }

        async function main() {
            if (!navigator.gpu) { alert('WebGPU not supported'); return; }
            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();

            const canvas = document.querySelector('canvas');
            const context = canvas.getContext('webgpu');
            const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
            context.configure({ device, format: canvasFormat });

            // Resize canvas to fill the page: set backing buffer size to CSS size * devicePixelRatio
            function resizeCanvasToDisplaySize() {
                const dpr = window.devicePixelRatio || 1;
                const displayWidth = Math.max(1, Math.floor(canvas.clientWidth * dpr));
                const displayHeight = Math.max(1, Math.floor(canvas.clientHeight * dpr));
                if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                    canvas.width = displayWidth;
                    canvas.height = displayHeight;
                }
            }
            // initial resize
            resizeCanvasToDisplaySize();
            // keep in sync on resize/orientation changes
            window.addEventListener('resize', resizeCanvasToDisplaySize);
            window.addEventListener('orientationchange', resizeCanvasToDisplaySize);

            // Load OBJ and build interleaved vertices
            const objRes = await fetch('./meshes/DioramaFinal_forWebGPU_Baking_Fixed_Emission.obj');
            const objText = await objRes.text();
            const { vertexData, indices } = parseOBJWithUVs(objText);
            // Compute per-vertex tangents and expand vertex data to include tangent (pos,uv,normal,tangent)
            const tangents = computeTangentsFromVertexData(vertexData, indices);
            const vertCount = vertexData.length / 8;
            const expandedVertexData = new Float32Array(vertCount * 11);
            for (let i = 0; i < vertCount; ++i) {
                const vOff = i * 8;
                const eOff = i * 11;
                // pos
                expandedVertexData[eOff + 0] = vertexData[vOff + 0];
                expandedVertexData[eOff + 1] = vertexData[vOff + 1];
                expandedVertexData[eOff + 2] = vertexData[vOff + 2];
                // uv
                expandedVertexData[eOff + 3] = vertexData[vOff + 3];
                expandedVertexData[eOff + 4] = vertexData[vOff + 4];
                // normal
                expandedVertexData[eOff + 5] = vertexData[vOff + 5];
                expandedVertexData[eOff + 6] = vertexData[vOff + 6];
                expandedVertexData[eOff + 7] = vertexData[vOff + 7];
                // tangent
                expandedVertexData[eOff + 8] = tangents[i * 3 + 0];
                expandedVertexData[eOff + 9] = tangents[i * 3 + 1];
                expandedVertexData[eOff + 10] = tangents[i * 3 + 2];
            }

            // Find mtllib in OBJ and parse the MTL for map_Kd
            let mtlName = null;
            for (const line of objText.split('\n')) {
                const p = line.trim().split(/\s+/);
                if (p[0] === 'mtllib') { mtlName = p[1]; break; }
            }
            let mtlText = null;
            let mapKd = null;
            if (mtlName) {
                try {
                    const mtlRes = await fetch(`./textures/${mtlName}`);
                    if (mtlRes.ok) {
                        mtlText = await mtlRes.text();
                        for (const line of mtlText.split('\n')) {
                            const l = line.trim();
                            if (!l) continue;
                            const parts = l.split(/\s+/);
                            if (parts[0] === 'map_Kd') {
                                const tokens = parts.slice(1);
                                for (let i = tokens.length - 1; i >= 0; --i) {
                                    const t = tokens[i];
                                    if (t && /\.(png|jpg|jpeg|bmp)$/i.test(t)) { mapKd = t.replace(/\\/g, '/'); break; }
                                }
                                if (!mapKd) mapKd = tokens[tokens.length - 1];
                                break;
                            }
                        }
                    }
                } catch (e) { console.warn('mtl load failed', e); }
            }
            let texInfo = null;
            if (mapKd) {
                const fname = mapKd.split('/').pop();
                try {
                    const res = await fetch(`./meshes/${fname}`);
                    const ct = (res.headers.get('content-type') || '').toLowerCase();
                    const blob = await res.blob();
                    const bitmap = await createImageBitmap(blob);
                    const tex = device.createTexture({ size: [bitmap.width, bitmap.height, 1], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
                    device.queue.copyExternalImageToTexture({ source: bitmap }, { texture: tex }, [bitmap.width, bitmap.height]);
                    texInfo = { view: tex.createView(), sampler: device.createSampler({ magFilter: 'linear', minFilter: 'linear' }) };
                } catch (e) { console.warn('texture candidate failed', url, e); }

            }

            // Parse MTL for normal and roughness maps (if we fetched the MTL earlier)
            let normalView = null;
            let roughView = null;
            let emissionView = null;
            const sampler = texInfo.sampler;
            if (mtlText) {
                let normalName = null, roughName = null;
                let emissionName = null;
                for (const line of mtlText.split('\n')) {
                    const l = line.trim(); if (!l) continue;
                    const parts = l.split(/\s+/);
                    const key = parts[0];
                    const tokens = parts.slice(1);
                    if (!tokens.length) continue;
                    // Detect normal maps
                    if (!normalName && (key === 'map_Bump')) {
                        for (let i = tokens.length - 1; i >= 0; --i) {
                            const t = tokens[i]; if (t && /\.(png|jpg|jpeg|bmp)$/i.test(t)) { normalName = t.replace(/\\/g, '/'); break; }
                        }
                        if (!normalName) normalName = tokens[tokens.length - 1];
                    }
                    // Detect roughness maps 
                    if (!roughName && (key === 'map_Ns')) {
                        for (let i = tokens.length - 1; i >= 0; --i) {
                            const t = tokens[i]; if (t && /\.(png|jpg|jpeg|bmp)$/i.test(t)) { roughName = t.replace(/\\/g, '/'); break; }
                        }
                        if (!roughName) roughName = tokens[tokens.length - 1];
                    }
                    // Detect emission maps
                    if (!emissionName && (key === 'map_Ke')) {
                        for (let i = tokens.length - 1; i >= 0; --i) {
                            const t = tokens[i]; if (t && /\.(png|jpg|jpeg|bmp)$/i.test(t)) { emissionName = t.replace(/\\/g, '/'); break; }
                        }
                        if (!emissionName) emissionName = tokens[tokens.length - 1];
                    }
                    if (normalName && roughName && emissionName) break;
                }

                async function tryLoadView(name) {
                    if (!name) return null;
                    // keep both the token (may include a folder) and the basename
                    const token = name;
                    const fname = name.split('/').pop();
                    try {
                        console.log('trying texture candidate:', name, 'for', name);
                        const res = await fetch(`./meshes/${fname}`);
                        // if (!res.ok) { console.log('not ok', url, res.status); continue; }
                        const ct = (res.headers.get('content-type') || '').toLowerCase();
                        const blob = await res.blob();
                        const bitmap = await createImageBitmap(blob);
                        // If this is an emission texture, compute and log its average luminance
                        if (name && (name.toLowerCase().includes('emission') || name.toLowerCase().includes('ke'))) {
                            try {
                                const cw = Math.min(64, bitmap.width);
                                const ch = Math.min(64, bitmap.height);
                                const tmp = document.createElement('canvas');
                                tmp.width = cw; tmp.height = ch;
                                const tctx = tmp.getContext('2d');
                                tctx.drawImage(bitmap, 0, 0, cw, ch);
                                const imgd = tctx.getImageData(0, 0, cw, ch).data;
                                let sum = 0;
                                for (let i = 0; i < imgd.length; i += 4) {
                                    // Rec.709 luminance
                                    sum += 0.2126 * imgd[i] + 0.7152 * imgd[i + 1] + 0.0722 * imgd[i + 2];
                                }
                                const avg = sum / (cw * ch * 255);
                                console.log('emission average luminance (0..1):', avg);
                            } catch (e) { console.warn('emission luminance analysis failed', e); }
                        }
                        // Use srgb format for better color handling (Blender baked textures are in sRGB)
                        const format = (name.toLowerCase().includes('emission') || name.toLowerCase().includes('ke')) ? 'rgba8unorm-srgb' : 'rgba8unorm';
                        const tex = device.createTexture({ size: [bitmap.width, bitmap.height, 1], format: format, usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
                        device.queue.copyExternalImageToTexture({ source: bitmap }, { texture: tex }, [bitmap.width, bitmap.height]);
                        console.log('loaded texture', name, 'from', name, 'with format', format);
                        return tex.createView();
                    } catch (e) { console.warn('candidate failed', name, e); }
                    console.warn('failed to load texture for', name);
                    return null;
                }
                normalView = await tryLoadView(normalName);
                roughView = await tryLoadView(roughName);
                const emissionViewLoaded = await tryLoadView(emissionName);
                emissionView = emissionViewLoaded;
            }

            // create GPU buffers (expanded vertex data includes tangent)
            const vertexBuffer = device.createBuffer({ label: 'vb', size: expandedVertexData.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST, mappedAtCreation: true });
            new Float32Array(vertexBuffer.getMappedRange()).set(expandedVertexData);
            vertexBuffer.unmap();

            const indexBuffer = device.createBuffer({ label: 'ib', size: indices.length * 4, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST, mappedAtCreation: true });
            new Uint32Array(indexBuffer.getMappedRange()).set(indices);
            indexBuffer.unmap();
            const indexCount = indices.length;

            // shader (MVP + sampler + colour + emission + roughness)
            const module = device.createShaderModule({
                code: `
                struct Uniforms { mvp: mat4x4f, flags: vec4f, exposureAndPad: vec4f };
                @group(0) @binding(0) var<uniform> uniforms: Uniforms;
                @group(0) @binding(1) var samp: sampler;
                @group(0) @binding(2) var colour: texture_2d<f32>;
                @group(0) @binding(3) var emissionTex: texture_2d<f32>;
                @group(0) @binding(4) var normalMap: texture_2d<f32>;
                @group(0) @binding(5) var roughMap: texture_2d<f32>;

                struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) normal: vec3f, @location(2) tangent: vec3f, @location(3) worldPos: vec3f };

                @vertex fn vs(@location(0) pos: vec3f, @location(1) uv: vec2f, @location(2) normal: vec3f, @location(3) tangent: vec3f) -> VOut {
                    var o: VOut;
                    o.pos = uniforms.mvp * vec4f(pos, 1.0);
                    o.uv = uv;
                    o.normal = normal;
                    o.tangent = tangent;
                    // pass model-space position through so fragment shader can compute view vector
                    o.worldPos = pos;
                    return o;
                }

                fn clamp01(x: f32) -> f32 { return max(0.0, min(1.0, x)); }

                @fragment fn fs(i: VOut) -> @location(0) vec4f {
                    let c = textureSample(colour, samp, i.uv);
                    let e = textureSample(emissionTex, samp, i.uv);
                    let roughSample = textureSample(roughMap, samp, i.uv);
                    let rough = roughSample.r;

                    // Tangent-space normal mapping
                    let N_vert = normalize(i.normal);
                    let T = normalize(i.tangent);
                    let B = normalize(cross(N_vert, T));
                    let nSample = textureSample(normalMap, samp, i.uv).rgb;
                    let nTS = nSample * 2.0 - vec3f(1.0);
                    let mappedN = normalize(vec3f(dot(vec3f(T.x, B.x, N_vert.x), nTS), dot(vec3f(T.y, B.y, N_vert.y), nTS), dot(vec3f(T.z, B.z, N_vert.z), nTS)));

                    // Lighting
                    // treat the light as a (large) point light at a fixed position so lighting varies with surface position
                    let lightPos = vec3f(50.0, 100.0, -50.0);
                    let L = normalize(lightPos - i.worldPos);
                    let V = normalize(uniforms.flags.yzw - i.worldPos);
                    let ambient = 0.1;
                    let NdotL = max(dot(mappedN, L), 0.0);
                    let diffuse = c.rgb * NdotL;

                    // limit maximum shininess to avoid extremely sharp 'diamond' highlights
                    let shininess = mix(256.0, 2.0, clamp01(rough));
                    let H = normalize(L + V);   
                    let specPower = pow(max(dot(mappedN, H), 0.0), shininess);
                    // reduce raw specular multiplier to avoid bright white highlights
                    let SPECULAR_MULT: f32 = 2.0;
                    let specular = vec3f(specPower) * SPECULAR_MULT;

                    // emission boost and saturation come from uniforms.exposureAndPad.y/z
                    let EMISSION_BOOST: f32 = uniforms.exposureAndPad.y;
                    let EMISSION_SAT: f32 = uniforms.exposureAndPad.z;
                    // apply saturation to the sampled emission color 
                    let e_lum = dot(e.rgb, vec3f(0.2126, 0.7152, 0.0722));
                    let e_sat = mix(vec3f(e_lum), e.rgb, EMISSION_SAT);
                    // allow HDR emission (no hard clamp) so boosting and post effects can work
                    var emission = e_sat * EMISSION_BOOST;

                    var color = vec3f(ambient * c.rgb) + diffuse + specular;
                    // Apply exposure (set by JS). Exposure scales linear radiance before tone mapping.
                    let exposure = uniforms.exposureAndPad.x;
                    color = color * exposure;
                    // multiply emission by uniforms.flags.x 
                    color = color + emission * uniforms.flags.x;

                    let toneMapped = color / (color + vec3f(1.0));
                    return vec4f(toneMapped, c.a);
                }
            ` });

            // Create pipeline with depth/stencil and disable face culling initially
            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: { module, entryPoint: 'vs', buffers: [{ arrayStride: 44, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x2' }, { shaderLocation: 2, offset: 20, format: 'float32x3' }, { shaderLocation: 3, offset: 32, format: 'float32x3' }] }] },
                fragment: { module, entryPoint: 'fs', targets: [{ format: canvasFormat }] },
                primitive: { topology: 'triangle-list', cullMode: 'none' },
                depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' }
            });

            // compute bounds and initialize interactive camera 
            const posArray = [];
            for (let i = 0; i < vertexData.length; i += 8) posArray.push(vertexData[i], vertexData[i + 1], vertexData[i + 2]);
            const bounds = computeBounds(posArray);

            // initial camera direction and distance based on bounds
            const initDir = [1, 0.6, 1]; let dlen = Math.hypot(...initDir); if (dlen === 0) dlen = 1; initDir[0] /= dlen; initDir[1] /= dlen; initDir[2] /= dlen;
            const initDistance = bounds.radius * 2.5;

            // Interactive camera state
            const camera = {
                target: [bounds.center[0], bounds.center[1], bounds.center[2]],
                yaw: 2.4,
                pitch: 0.15,
                distance: initDistance,
                minDistance: Math.max(0.1, bounds.radius * 0.5),
                maxDistance: Math.max(1.0, bounds.radius * 50),
                pan: [0, 0, 0]
            };

           
            const uniformBuffer = device.createBuffer({ size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

            // Press L to toggle emission 
            let EMISSION_ENABLED = 1.0;
            // exposure defaults: when emission is on we want a dimmer scene; when off, a brighter scene
            let exposure = 0.8
            window.addEventListener('keydown', (ev) => {
                if (ev.key === 'l' || ev.key === 'L') {
                    EMISSION_ENABLED = EMISSION_ENABLED ? 0.0 : 1.0;
                }
            });

            // A slider for tuning light brightness (exposure)
            const ui = document.createElement('div');
            ui.style.position = 'absolute'; ui.style.left = '8px'; ui.style.top = '8px'; ui.style.padding = '6px'; ui.style.background = 'rgba(0,0,0,0.35)'; ui.style.color = 'white'; ui.style.fontFamily = 'sans-serif'; ui.style.fontSize = '12px'; ui.style.borderRadius = '4px';
            ui.innerHTML = `Scene Light: <input id="exposureSlider" type="range" min="0.1" max="2.0" step="0.01" value="${exposure}" style="vertical-align:middle;width:160px"> <span id="exposureValue">${exposure}</span>`;
            document.body.appendChild(ui);
            const exposureSlider = document.getElementById('exposureSlider');
            const exposureValue = document.getElementById('exposureValue');
            exposureSlider.addEventListener('input', (e) => {
                exposure = parseFloat(exposureSlider.value);
                exposureValue.textContent = exposure.toFixed(2);
            });

            console.log('Creating bind group with:', { emissionView, roughView, normalView, colourView: texInfo.view });
            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0), entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: texInfo.sampler },
                    { binding: 2, resource: texInfo.view },
                    { binding: 3, resource: emissionView },
                    { binding: 4, resource: normalView },
                    { binding: 5, resource: roughView }
                ]
            });
            console.log('Bind group created successfully');

            // Create a depth texture to enable proper depth testing so triangles render correctly
            let depthTexture = device.createTexture({ size: [canvas.width, canvas.height, 1], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
            const renderPassDescriptor = {
                // Background set to RGB(130,158,207) -> normalized ~[0.50980,0.61961,0.81176]
                colorAttachments: [{ clearValue: [0.50980392, 0.61960784, 0.81176471, 1], loadOp: 'clear', storeOp: 'store' }],
                depthStencilAttachment: { view: depthTexture.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store' }
            };

            // Interaction handlers (left-drag to rotate, Shift+left-drag to pan, wheel to zoom)
            let dragging = false;
            let lastX = 0, lastY = 0;

            function updateMVPAndWrite() {
                const aspect = canvas.width / canvas.height;
                const proj = perspective(Math.PI / 3, aspect, Math.max(bounds.radius * 0.01, 0.01), bounds.radius * 20 + 10);

                // spherical to cartesian
                const r = camera.distance;
                const cp = Math.cos(camera.pitch), sp = Math.sin(camera.pitch);
                const cy = Math.cos(camera.yaw), sy = Math.sin(camera.yaw);
                const eye = [
                    camera.target[0] + r * cp * sy,
                    camera.target[1] + r * sp,
                    camera.target[2] + r * cp * cy
                ];

                const view = lookAt(eye, camera.target, [0, 1, 0]);
                const mvp = multiplyMat4(proj, view);
                // write mvp (16 floats) + flags (4 floats) = 20 floats total
                const ub = new Float32Array(24);
                ub.set(mvp, 0);
                ub[16] = EMISSION_ENABLED; // flags.x
                // pack camera eye position into flags.yzw so shader can compute per-fragment V
                ub[17] = eye[0]; ub[18] = eye[1]; ub[19] = eye[2];
                // exposure stored in exposureAndPad.x at ub[20]
                ub[20] = exposure;
                ub[21] = 3.5; // EMISSION_BOOST default 
                ub[22] = 2.5; // EMISSION_SAT default 
                ub[23] = 0.0;
                device.queue.writeBuffer(uniformBuffer, 0, ub);
            }

            canvas.addEventListener('pointerdown', (e) => {
                // Only start dragging for the primary (left) button.
                if (e.button !== 0) return;
                canvas.setPointerCapture(e.pointerId);
                dragging = true; lastX = e.clientX; lastY = e.clientY;
                canvas.style.cursor = 'grabbing';
            });
            canvas.addEventListener('pointerup', (e) => {
                try { canvas.releasePointerCapture(e.pointerId); } catch (err) { }
                dragging = false; canvas.style.cursor = 'default';
            });
            canvas.addEventListener('pointercancel', (e) => { dragging = false; canvas.style.cursor = 'default'; });

            canvas.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - lastX; const dy = e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;
                const rect = canvas.getBoundingClientRect();
                const w = rect.width, h = rect.height;
                // If Shift is held, pan; otherwise rotate (left-drag).
                if (e.shiftKey) {
                    // pan: translate camera.target in world space based on camera axes
                    const r = camera.distance;
                    const cp = Math.cos(camera.pitch), sp = Math.sin(camera.pitch);
                    const cy = Math.cos(camera.yaw), sy = Math.sin(camera.yaw);
                    const eye = [
                        camera.target[0] + r * cp * sy,
                        camera.target[1] + r * sp,
                        camera.target[2] + r * cp * cy
                    ];
                    const forward = [camera.target[0] - eye[0], camera.target[1] - eye[1], camera.target[2] - eye[2]];
                    const flen = Math.hypot(...forward) || 1.0;
                    forward[0] /= flen; forward[1] /= flen; forward[2] /= flen;
                    const up = [0, 1, 0];
                    const right = [
                        forward[2] * up[1] - forward[1] * up[2],
                        forward[0] * up[2] - forward[2] * up[0],
                        forward[1] * up[0] - forward[0] * up[1]
                    ];
                    const rlen = Math.hypot(...right) || 1.0; right[0] /= rlen; right[1] /= rlen; right[2] /= rlen;
                    const panSpeed = camera.distance * 0.002;
                    camera.target[0] += (-dx * panSpeed) * right[0] + (dy * panSpeed) * up[0];
                    camera.target[1] += (-dx * panSpeed) * right[1] + (dy * panSpeed) * up[1];
                    camera.target[2] += (-dx * panSpeed) * right[2] + (dy * panSpeed) * up[2];
                } else {
                    const rotSpeed = 0.005;
                    camera.yaw -= dx * rotSpeed;
                    camera.pitch += dy * rotSpeed;
                    camera.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camera.pitch));
                }
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.0015;
                camera.distance *= (1 + e.deltaY * zoomSpeed);
                camera.distance = Math.max(camera.minDistance, Math.min(camera.maxDistance, camera.distance));
            }, { passive: false });

            // --- Render loop (updates mvp each frame based on camera)
            function render() {
                // If canvas size changed, recreate depth texture
                const curTex = context.getCurrentTexture();
                renderPassDescriptor.colorAttachments[0].view = curTex.createView();
                const gfxWidth = canvas.width, gfxHeight = canvas.height;
                // simple resize check
                if (depthTexture.width !== gfxWidth || depthTexture.height !== gfxHeight) {
                    depthTexture = device.createTexture({ size: [gfxWidth, gfxHeight, 1], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
                    renderPassDescriptor.depthStencilAttachment.view = depthTexture.createView();
                }

                // update MVP from camera before drawing
                updateMVPAndWrite();

                const cmd = device.createCommandEncoder();
                const pass = cmd.beginRenderPass(renderPassDescriptor);
                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                pass.setVertexBuffer(0, vertexBuffer);
                pass.setIndexBuffer(indexBuffer, 'uint32');
                pass.drawIndexed(indexCount);
                pass.end();
                device.queue.submit([cmd.finish()]);

                requestAnimationFrame(render);
            }

            requestAnimationFrame(render);
        }
        main();
    </script>
</body>
